<div class="kawaii-container">
  
  <header class="header">
    <h1>✨ Kawaii Photobooth ✨</h1>
    <p>Snap a cute pic with magic filters!</p>
  </header>

  <div class="main-content" *ngIf="!capturedImage">
    
    <div class="viewport-wrapper">
      <!-- Hidden video element, processing service uses it to draw on canvas -->
      <video #videoElement autoplay playsinline muted style="display: none;"></video>
      
      <div class="canvas-container" [ngClass]="selectedFrame">
        <canvas #canvasElement></canvas>
        <div class="frame-overlay"></div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="actions">
        <button class="btn btn-primary btn-round pulse-hover" (click)="takePhoto()">
          <span class="icon">📸</span> Snap!
        </button>
        <button class="btn btn-secondary btn-pill" (click)="toggleBackgroundRemoval()">
          <span class="icon">🔮</span> {{ removeBackground ? 'Magic BG On' : 'Magic BG Off' }}
        </button>
      </div>

      <div class="settings-card">
        <h3 (click)="showFilters = !showFilters" class="settings-title">
          🎨 Cute Filters 
          <span class="chevron">{{ showFilters ? '▲' : '▼' }}</span>
        </h3>
        
        <div class="filters-drawer" [class.open]="showFilters">
          <div class="filter-group">
            <label>Brightness</label>
            <input type="range" min="50" max="150" [(ngModel)]="filters.brightness" (change)="onFilterChange()">
          </div>
          
          <div class="filter-group">
            <label>Contrast</label>
            <input type="range" min="50" max="150" [(ngModel)]="filters.contrast" (change)="onFilterChange()">
          </div>
          
          <div class="filter-group">
            <label>Saturation</label>
            <input type="range" min="0" max="200" [(ngModel)]="filters.saturation" (change)="onFilterChange()">
          </div>

          <div class="filter-toggles">
            <label class="checkbox-label">
              <input type="checkbox" [(ngModel)]="filters.pastel" (change)="onFilterChange()">
              <span class="checkmark"></span>
              Pastel Glow
            </label>
          </div>

          <div class="frame-selector">
            <label>Choose a Frame:</label>
            <select [(ngModel)]="selectedFrame">
              <option *ngFor="let frame of frames" [value]="frame.id">
                {{ frame.name }}
              </option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="preview-content" *ngIf="capturedImage">
    <h2>YAY! Looking Cute! 💖</h2>
    
    <div class="result-card">
      <img [src]="capturedImage" alt="Captured" class="result-image" />
      
      <div class="share-section">
        <div class="qr-code-box" *ngIf="qrCodeUrl">
          <p>Scan to Share!</p>
          <img [src]="qrCodeUrl" alt="QR Code" class="qr-code-img" />
        </div>
        
        <div class="share-actions">
          <button class="btn btn-primary bounce" (click)="sharePhoto()">
            <span class="icon">🚀</span> Share to App
          </button>
          <button class="btn btn-secondary" (click)="downloadPhoto()">
            <span class="icon">💾</span> Save
          </button>
          <button class="btn btn-outline" (click)="retakePhoto()">
            <span class="icon">🔄</span> Retake
          </button>
        </div>
      </div>
    </div>
  </div>

</div>
