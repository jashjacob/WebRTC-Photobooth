<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Kawaii Photobooth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 30%, #f3e5f5 60%, #e8eaf6 100%);
      color: #5a4a6a;
      text-align: center;
      padding: 24px;
    }
    .icon { font-size: 5rem; margin-bottom: 24px; }
    h1 { font-size: 2rem; font-weight: 900; margin-bottom: 12px; }
    p { font-size: 1.1rem; opacity: 0.75; margin-bottom: 36px; line-height: 1.6; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #ff69b4, #9370db);
      color: white;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 100px;
      font-size: 1.1rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(255,105,180,0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    a:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(255,105,180,0.5); }
  </style>
</head>
<body>
  <div class="icon">📸</div>
  <h1>404 — Page not found</h1>
  <p>Looks like this shot didn't develop.<br>Head back to the studio and try again!</p>
